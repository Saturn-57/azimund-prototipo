<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>MP+T test</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.js'></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            height: 100%;
            background: url(bg.jpg);
            background-size: cover;
        }

        #project {
            display: block;
            position: absolute;
            top: 5vh;
            left: 50%;
            transform: translate(-50%);
            width: 15%;
            height: 40px;
            padding: 10px;
            border: none;
            border-radius: 3px;
            font-size: 12px;
            text-align: center;
            color: #fff;
            background: #0015ff;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
            }
        }
    </script>

    <div id="map"></div>
    <button id="project">projeção</button>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const TERRAIN_SOURCE = {
            type: 'raster-dem',
            tiles: ['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'],
            encoding: 'terrarium',
            tileSize: 256,
            maxzoom: 15
        };

        const geojson = {
            'type': 'FeatureCollection',
            'features': [
                {
                    'type': 'Feature',
                    'properties': {
                        'message': 'teste',
                        'iconSize': [60, 60]
                    },
                    'geometry': {
                        'type': 'Point',
                        'coordinates': [19.324462890625, -26.024695711685304]
                    }
                },
                {
                    'type': 'Feature',
                    'properties': {
                        'message': '12345',
                        'iconSize': [50, 50]
                    },
                    'geometry': {
                        'type': 'Point',
                        'coordinates': [-61.2158203125, -15.97189158092897]
                    }
                },
                {
                    'type': 'Feature',
                    'properties': {
                        'message': 'lorem ipsum dolor sit amet',
                        'iconSize': [40, 40]
                    },
                    'geometry': {
                        'type': 'Point',
                        'coordinates': [-25.29223632812499, 28.28151823530889]
                    }
                }
            ]
        };

        const map = new maplibregl.Map({
            container: 'map',
            style: {
                "version": 8,
                "projection": {
                    "type": "globe"
                },
                "sources": {
                    "satellite": {
                        "type": "raster",
                        "tiles": ["https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg"],
                        "tileSize": 256
                    }
                },
                "layers": [
                    {
                        "id": "satellite",
                        "type": "raster",
                        "source": "satellite"
                    }
                ],
                "sky": {
                    "atmosphere-blend": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        0, 0.8,
                        5, 1.0,
                        7, 0
                    ]
                },
                "light": {
                    "anchor": "map",
                    "position": [15, 90, 180]
                }
            },
            zoom: 2.5,
            center: [-50, -30],
            maxPitch: 89,
            pitch: 15,
            canvasContextAttributes: { antialias: true }
        });

        // add markers to map
        geojson.features.forEach((marker) => {;
            // create a DOM element for the marker
            const el = document.createElement('div');
            el.className = 'marker';
            el.style.backgroundImage =
                `url(https://picsum.photos/${
                    marker.properties.iconSize.join('/')
                }/)`;
            el.style.width = `${marker.properties.iconSize[0]}px`;
            el.style.height = `${marker.properties.iconSize[1]}px`;

            el.addEventListener('click', () => {
                window.alert(marker.properties.message);
            });

            // add marker to map
            new maplibregl.Marker({element: el})
                .setLngLat(marker.geometry.coordinates)
                .addTo(map);
        });

        const draw = new MaplibreTerradrawControl.MaplibreTerradrawControl({
        modes: [
                'point',
                'linestring',
                'polygon',
                'rectangle',
                'circle',
                'freehand',
                'angled-rectangle',
                'sensor',
                'sector',
                'select',
                'delete-selection',
                'delete',
                'download'
            ],
            open: true,
        });
        map.addControl(draw, 'top-left');

        map.on('style.load', () => {
            map.addSource('terrain', TERRAIN_SOURCE);
            map.setTerrain({
                source: 'terrain',
                exaggeration: 2.5
            });
        });

        document.getElementById('project').addEventListener('click', () => {
            const currentProjection = map.getProjection();
            map.setProjection({
                type: currentProjection.type === 'globe' ? 'equirectangular' : 'globe'
            });
        });

        const customLayer = {
    id: '3d-model',
    type: 'custom',
    renderingMode: '3d',

    onAdd(map, gl) {
        this.camera = new THREE.Camera();
        this.map = map;

        this.models = [
            {
                url: 'models/totem_1.gltf',
                origin: [-50.200395591397736, -29.65694190676408],
                altitude: 0,
                scale: 1000.0,
                scene: null
            },
            {
                url: 'models/casa.gltf',
                origin: [30.97547134189248, 30.03035072947374],
                altitude: -70000,
                scale: 50000.0,
                scene: null
            }
        ];

        const loader = new GLTFLoader();
    

        this.models.forEach((model) => {
            const scene = new THREE.Scene();

            // Lights per scene
            const light1 = new THREE.DirectionalLight(0xffffff);
            light1.position.set(0, -70, 100).normalize();
            scene.add(light1);

            const light2 = new THREE.DirectionalLight(0xffffff);
            light2.position.set(0, 70, 100).normalize();
            scene.add(light2);

            loader.load(model.url, (gltf) => {
                scene.add(gltf.scene);
            });

            model.scene = scene;
        });

        this.renderer = new THREE.WebGLRenderer({
            canvas: map.getCanvas(),
            context: gl,
            antialias: true
        });

        this.renderer.autoClear = false;
    },

    render(gl, args) {
        const mainMatrix = new THREE.Matrix4().fromArray(args.defaultProjectionData.mainMatrix);

        this.models.forEach((model) => {
            if (!model.scene) return;

            const modelMatrix = this.map.transform.getMatrixForModel(model.origin, model.altitude);
            const l = new THREE.Matrix4().fromArray(modelMatrix).scale(
                new THREE.Vector3(model.scale, model.scale, model.scale)
            );

            this.camera.projectionMatrix = mainMatrix.clone().multiply(l);

            this.renderer.resetState();
            this.renderer.render(model.scene, this.camera);
        });

        this.map.triggerRepaint();
    }
};

        map.on('style.load', () => {
            map.addLayer(customLayer);
        });
    </script>
</body>

</html>

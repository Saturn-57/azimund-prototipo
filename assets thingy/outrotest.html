<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re:Earth Terrain — 3D Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0d0f;
    --surface: #141518;
    --surface2: #1c1e22;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --accent: #e05a3a;
    --accent2: #f0a87a;
    --text: #f0ede8;
    --muted: #7a7870;
    --muted2: #9a9890;
    --green: #4caf7d;
    --blue: #5b9cf6;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; overflow: hidden; }

  #map { position: absolute; inset: 0; }

  /* TOP BAR */
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    z-index: 10;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.02em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .logo-sep {
    width: 1px; height: 20px;
    background: var(--border2);
    margin: 0 4px;
  }

  .logo-sub {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .spacer { flex: 1; }

  .tag-badge {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--accent2);
    border: 1px solid rgba(224, 90, 58, 0.3);
    padding: 3px 8px;
    border-radius: 3px;
    text-transform: uppercase;
  }

  /* STATUS BAR */
  #statusbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 32px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 20px;
    z-index: 10;
    font-size: 11px;
    color: var(--muted);
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
  }

  .status-dot.loading { background: var(--accent2); animation: blink 0.8s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* PANEL */
  #panel {
    position: absolute;
    top: 64px;
    left: 16px;
    width: 272px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    z-index: 10;
    overflow: hidden;
  }

  .panel-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .panel-section:last-child { border-bottom: none; }

  .section-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* ENDPOINT DISPLAY */
  .endpoint-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 10px;
    line-height: 1.6;
    color: var(--muted2);
    word-break: break-all;
    font-family: 'DM Mono', monospace;
  }

  .endpoint-box .base { color: var(--muted); }
  .endpoint-box .enc { color: var(--accent2); }
  .endpoint-box .dtype { color: var(--blue); }
  .endpoint-box .suffix { color: var(--green); }

  /* TOGGLE GROUPS */
  .toggle-group {
    display: flex;
    border: 1px solid var(--border2);
    border-radius: 4px;
    overflow: hidden;
  }

  .toggle-btn {
    flex: 1;
    padding: 7px 0;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    border-right: 1px solid var(--border2);
  }

  .toggle-btn:last-child { border-right: none; }

  .toggle-btn:hover { background: var(--surface2); color: var(--text); }

  .toggle-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .toggle-btn.active-blue {
    background: #234;
    color: var(--blue);
    border-color: rgba(91,156,246,0.3);
  }

  /* SLIDER */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
  }

  .slider-label { font-size: 11px; color: var(--muted); min-width: 80px; }
  .slider-val { font-size: 11px; color: var(--accent2); min-width: 28px; text-align: right; }

  input[type=range] {
    flex: 1;
    appearance: none;
    height: 3px;
    background: var(--border2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* LOCATION PRESET BUTTONS */
  .loc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .loc-btn {
    padding: 8px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted2);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }

  .loc-btn:hover {
    border-color: var(--border2);
    color: var(--text);
    background: #202226;
  }

  .loc-name { display: block; font-weight: 500; margin-bottom: 2px; }
  .loc-coords { display: block; font-size: 9px; color: var(--muted); }

  /* ELEVATION DISPLAY */
  #elev-display {
    position: absolute;
    top: 64px;
    right: 16px;
    width: 160px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    z-index: 10;
  }

  .elev-label { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .elev-value { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; color: var(--accent2); line-height: 1; }
  .elev-unit { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* LOADING OVERLAY */
  #loading {
    position: absolute;
    inset: 52px 0 32px 0;
    background: rgba(12, 13, 15, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: opacity 0.5s;
  }

  #loading.hidden { opacity: 0; pointer-events: none; }

  .loading-inner {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .loading-ring {
    width: 40px; height: 40px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* MapLibre overrides */
  .maplibregl-ctrl-bottom-right { bottom: 36px !important; }
  .maplibregl-ctrl-bottom-left { bottom: 36px !important; }
  .maplibregl-ctrl { background: var(--surface) !important; border: 1px solid var(--border) !important; }
  .maplibregl-ctrl button { background: transparent !important; }
  .maplibregl-ctrl button span { filter: invert(1) brightness(0.7); }
  .maplibregl-ctrl-attrib { background: var(--bg) !important; color: var(--muted) !important; font-size: 9px !important; }
  .maplibregl-ctrl-attrib a { color: var(--muted2) !important; }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">
    <div class="logo-dot"></div>
    Re:Earth Terrain
  </div>
  <div class="logo-sep"></div>
  <span class="logo-sub">terrain.reearth.land</span>
  <div class="spacer"></div>
  <span class="tag-badge">MapLibre GL JS</span>
</div>

<div id="map"></div>

<div id="loading">
  <div class="loading-inner">
    <div class="loading-ring"></div>
    <div class="loading-text">Loading terrain tiles…</div>
  </div>
</div>

<!-- CONTROL PANEL -->
<div id="panel">
  <div class="panel-section">
    <div class="section-label">Endpoint</div>
    <div class="endpoint-box" id="endpoint-display">
      <span class="base">terrain.reearth.land/</span><span class="enc" id="ep-enc">mapbox</span><span class="base">/</span><span class="dtype" id="ep-dtype">elevation</span><span class="suffix">/tilejson.json</span>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-label">Encoding</div>
    <div class="toggle-group" id="enc-group">
      <button class="toggle-btn active" data-enc="mapbox">mapbox</button>
      <button class="toggle-btn" data-enc="terrarium">terrarium</button>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-label">Data type</div>
    <div class="toggle-group" id="dtype-group">
      <button class="toggle-btn active" data-dtype="elevation">elevation</button>
      <button class="toggle-btn" data-dtype="ellipsoid">ellipsoid</button>
      <button class="toggle-btn" data-dtype="geoid">geoid</button>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-label">Terrain exaggeration</div>
    <div class="slider-row">
      <span class="slider-label">exaggeration</span>
      <input type="range" id="exag-slider" min="0.5" max="3" step="0.1" value="1.2">
      <span class="slider-val" id="exag-val">1.2×</span>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-label">Locations</div>
    <div class="loc-grid">
      <button class="loc-btn" data-lon="138.73" data-lat="35.36" data-zoom="10" data-pitch="72" data-bearing="-35">
        <span class="loc-name">Mt. Fuji</span>
        <span class="loc-coords">35.36°N 138.73°E</span>
      </button>
      <button class="loc-btn" data-lon="86.92" data-lat="27.98" data-zoom="10" data-pitch="70" data-bearing="20">
        <span class="loc-name">Everest</span>
        <span class="loc-coords">27.98°N 86.92°E</span>
      </button>
      <button class="loc-btn" data-lon="-119.54" data-lat="37.74" data-zoom="9" data-pitch="68" data-bearing="15">
        <span class="loc-name">Yosemite</span>
        <span class="loc-coords">37.74°N 119.54°W</span>
      </button>
      <button class="loc-btn" data-lon="11.39" data-lat="47.27" data-zoom="12" data-pitch="70" data-bearing="-10">
        <span class="loc-name">Alps</span>
        <span class="loc-coords">47.27°N 11.39°E</span>
      </button>
    </div>
  </div>
</div>

<!-- ELEVATION READOUT -->
<div id="elev-display">
  <div class="elev-label">Cursor elevation</div>
  <div class="elev-value" id="elev-val">—</div>
  <div class="elev-unit" id="elev-unit">hover map</div>
</div>

<div id="statusbar">
  <div class="status-item">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Connected</span>
  </div>
  <div class="status-item">
    <span id="coord-text">—</span>
  </div>
  <div class="spacer"></div>
  <span style="color: var(--muted); font-size: 10px;">Mapterhorn DEM + EGM2008 geoid — CC BY 4.0</span>
</div>

<script>
  let currentEnc = 'mapbox';
  let currentDtype = 'elevation';
  let currentExag = 1.2;

  const BASE = 'https://terrain.reearth.land';

  function getTileJsonUrl() {
    return `${BASE}/${currentEnc}/${currentDtype}/tilejson.json`;
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '© OpenStreetMap Contributors',
          maxzoom: 19
        }
      },
      layers: [
        { id: 'osm', type: 'raster', source: 'osm', paint: { 'raster-brightness-min': 0, 'raster-saturation': -0.4, 'raster-brightness-max': 0.7 } }
      ]
    },
    center: [138.73, 35.36],
    zoom: 10,
    pitch: 72,
    bearing: -35,
    maxPitch: 85,
    antialias: true
  });

  function setStatus(loading) {
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    if (loading) {
      dot.className = 'status-dot loading';
      txt.textContent = 'Loading tiles…';
    } else {
      dot.className = 'status-dot';
      txt.textContent = 'Connected';
    }
  }

  function updateEndpointDisplay() {
    document.getElementById('ep-enc').textContent = currentEnc;
    document.getElementById('ep-dtype').textContent = currentDtype;
  }

  function applyTerrain() {
    setStatus(true);
    document.getElementById('loading').classList.remove('hidden');

    if (map.getLayer('hills')) map.removeLayer('hills');
    if (map.getSource('terrainSrc')) map.removeSource('terrainSrc');
    if (map.getSource('hillSrc')) map.removeSource('hillSrc');

    try { map.setTerrain(null); } catch(e) {}

    const enc = currentEnc === 'mapbox' ? 'mapbox' : 'terrarium';

    map.addSource('terrainSrc', {
      type: 'raster-dem',
      url: getTileJsonUrl(),
      encoding: enc,
      tileSize: 256
    });

    map.addSource('hillSrc', {
      type: 'raster-dem',
      url: getTileJsonUrl(),
      encoding: enc,
      tileSize: 256
    });

    map.addLayer({
      id: 'hills',
      type: 'hillshade',
      source: 'hillSrc',
      paint: {
        'hillshade-shadow-color': '#2a1f14',
        'hillshade-highlight-color': '#f8f4ee',
        'hillshade-accent-color': '#8a7060',
        'hillshade-exaggeration': 0.5
      }
    }, 'osm');

    map.setTerrain({ source: 'terrainSrc', exaggeration: currentExag });

    updateEndpointDisplay();
  }

  map.on('load', () => {
    applyTerrain();
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      setStatus(false);
    }, 2500);
  });

  map.on('sourcedataloading', (e) => {
    if (e.sourceId === 'terrainSrc') setStatus(true);
  });

  map.on('sourcedata', (e) => {
    if (e.sourceId === 'terrainSrc' && e.isSourceLoaded) {
      setStatus(false);
      document.getElementById('loading').classList.add('hidden');
    }
  });

  // Elevation readout
  map.on('mousemove', (e) => {
    const elev = map.queryTerrainElevation(e.lngLat, { exaggerated: false });
    const valEl = document.getElementById('elev-val');
    const unitEl = document.getElementById('elev-unit');
    const coordEl = document.getElementById('coord-text');

    if (elev !== null && elev !== undefined) {
      valEl.textContent = Math.round(elev).toLocaleString();
      unitEl.textContent = 'm above ' + (currentDtype === 'ellipsoid' ? 'WGS84 ellipsoid' : 'mean sea level');
    } else {
      valEl.textContent = '—';
      unitEl.textContent = 'no data';
    }

    const lng = e.lngLat.lng.toFixed(4);
    const lat = e.lngLat.lat.toFixed(4);
    coordEl.textContent = `${lat > 0 ? lat+'°N' : Math.abs(lat)+'°S'}  ${lng > 0 ? lng+'°E' : Math.abs(lng)+'°W'}`;
  });

  // Encoding toggle
  document.getElementById('enc-group').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-enc]');
    if (!btn) return;
    currentEnc = btn.dataset.enc;
    document.querySelectorAll('[data-enc]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyTerrain();
  });

  // Data type toggle
  document.getElementById('dtype-group').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-dtype]');
    if (!btn) return;
    currentDtype = btn.dataset.dtype;
    document.querySelectorAll('[data-dtype]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyTerrain();
  });

  // Exaggeration slider
  document.getElementById('exag-slider').addEventListener('input', (e) => {
    currentExag = parseFloat(e.target.value);
    document.getElementById('exag-val').textContent = currentExag.toFixed(1) + '×';
    try { map.setTerrain({ source: 'terrainSrc', exaggeration: currentExag }); } catch(err) {}
  });

  // Location presets
  document.querySelectorAll('.loc-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      map.flyTo({
        center: [parseFloat(btn.dataset.lon), parseFloat(btn.dataset.lat)],
        zoom: parseFloat(btn.dataset.zoom),
        pitch: parseFloat(btn.dataset.pitch),
        bearing: parseFloat(btn.dataset.bearing),
        duration: 2000,
        easing: t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t
      });
    });
  });
</script>
</body>
</html>
